<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORUM | PERFUMERÍA HUD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Cinematic Noir Luxury Palette */
            --bg-deep: #03070e;     
            --bg-black: #000000;    
            --blue-steel: #4A7CFF;  
            --white-pure: #ffffff;  
            
            --tech-line: rgba(255, 255, 255, 0.1);
            --tech-line-strong: rgba(255, 255, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; text-transform: uppercase; }

        html, body {
            width: 100vw; max-width: 100%; min-height: 100vh;
            background-color: var(--bg-black); color: var(--white-pure);
            font-family: 'Inter', sans-serif; line-height: 1.5; overflow-x: hidden;
            scrollbar-width: none; 
        }
        body::-webkit-scrollbar { display: none; }

        /* =========================================
           CINEMATIC STAGE & LIGHTING
           ========================================= */
        .cinematic-stage {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; background: radial-gradient(circle at 50% -20%, var(--bg-deep) 0%, var(--bg-black) 90%);
            pointer-events: none;
        }

        /* HAZ DE LUZ VOLUMÉTRICO CON PARPADEO ROTO */
        .volumetric-spotlight {
            position: absolute; top: -20%; left: 50%; transform: translateX(-50%);
            width: 70vw; height: 130vh;
            background: radial-gradient(ellipse at top, rgba(74, 124, 255, 0.15) 0%, rgba(74, 124, 255, 0.05) 40%, transparent 70%);
            filter: blur(40px);
            animation: brokenLight 10s infinite;
        }

        .hard-beam {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 15vw; height: 100vh;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(74, 124, 255, 0.05) 50%, transparent 100%);
            filter: blur(15px); mix-blend-mode: screen;
            animation: brokenLight 10s infinite;
        }

        @keyframes brokenLight {
            0%, 5%, 15%, 25%, 100% { opacity: 1; }
            2%, 4% { opacity: 0.1; }
            10%, 14% { opacity: 0.4; }
            20% { opacity: 0; }
            21% { opacity: 0.8; }
            22% { opacity: 0; }
            24% { opacity: 0.9; }
            50%, 80% { opacity: 0.95; }
        }

        /* PARTÍCULAS DE LUZ (POLVO FLOTANTE) */
        .particles-layer-1, .particles-layer-2 {
            position: absolute; top: 0; left: 0; width: 100vw; height: 200vh;
            pointer-events: none; mix-blend-mode: screen; opacity: 0.4;
        }
        
        .particles-layer-1 {
            background-image: 
                radial-gradient(1px 1px at 20vw 10vh, #fff, transparent),
                radial-gradient(1.5px 1.5px at 60vw 30vh, var(--blue-steel), transparent),
                radial-gradient(2px 2px at 30vw 50vh, #fff, transparent),
                radial-gradient(1px 1px at 80vw 70vh, var(--blue-steel), transparent),
                radial-gradient(1.5px 1.5px at 50vw 90vh, #fff, transparent);
            background-size: 100vw 100vh;
            animation: floatParticles 40s linear infinite;
        }

        .particles-layer-2 {
            background-image: 
                radial-gradient(2px 2px at 40vw 20vh, #fff, transparent),
                radial-gradient(1px 1px at 80vw 40vh, var(--blue-steel), transparent),
                radial-gradient(1.5px 1.5px at 10vw 60vh, #fff, transparent),
                radial-gradient(2px 2px at 70vw 80vh, var(--blue-steel), transparent);
            background-size: 80vw 80vh;
            animation: floatParticles 25s linear infinite reverse;
            opacity: 0.2;
        }

        @keyframes floatParticles {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        /* =========================================
           TECHNICAL FRAME (BLUEPRINT STYLE)
           ========================================= */
        .blueprint-frame {
            position: fixed; top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 1px solid var(--tech-line); z-index: 90; pointer-events: none;
        }

        .cross { position: absolute; width: 15px; height: 15px; }
        .cross::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: var(--tech-line-strong); }
        .cross::after { content: ''; position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: var(--tech-line-strong); }

        .c-tl { top: -7.5px; left: -7.5px; } .c-tr { top: -7.5px; right: -7.5px; }
        .c-bl { bottom: -7.5px; left: -7.5px; } .c-br { bottom: -7.5px; right: -7.5px; }

        .frame-line-h { position: absolute; top: 15%; left: 0; width: 100%; height: 1px; background: var(--tech-line); }
        .frame-line-v { position: absolute; top: 0; left: 45%; width: 1px; height: 100%; background: var(--tech-line); }

        .tech-font { font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.15em; color: rgba(255,255,255,0.7); }

        /* =========================================
           CONTENT STRUCTURE
           ========================================= */
        .content-layer { position: relative; z-index: 10; display: flex; width: 100vw; min-height: 100vh; }

        /* PANEL IZQUIERDO */
        .left-pane {
            width: 45%; position: fixed; top: 0; left: 0; height: 100vh;
            display: flex; flex-direction: column; padding: 4rem 3rem; pointer-events: none; 
        }
        .left-pane > * { pointer-events: auto; }

        .top-nav { display: flex; justify-content: space-between; margin-bottom: 8vh; }
        .top-nav div { line-height: 1.6; }

        .giant-text {
            font-family: 'Inter', sans-serif; font-weight: 900; font-size: 6vw;
            line-height: 0.9; letter-spacing: -0.04em; margin-top: 5vh; margin-bottom: 2rem;
            color: var(--white-pure); display: flex; flex-direction: column;
        }
        .giant-text span:nth-child(2) { color: var(--blue-steel); margin-left: 10%; }

        .tech-subtitle { display: flex; align-items: center; gap: 15px; margin-bottom: 2rem; color: var(--blue-steel); font-weight: 700; }
        .tech-subtitle::after { content: ""; flex-grow: 1; height: 1px; background: var(--tech-line); }

        .tech-paragraph {
            font-size: 0.65rem; line-height: 1.8; letter-spacing: 0.05em; color: rgba(255,255,255,0.6);
            max-width: 80%; border-left: 2px solid var(--blue-steel); padding-left: 1rem;
        }

        /* =========================================
           PANEL DERECHO: CATÁLOGO MINIMALISTA
           ========================================= */
        .right-pane { width: 55%; margin-left: 45%; padding: 4rem 3rem; min-height: 100vh; margin-top: 5vh; }

        .search-container { width: 100%; margin-bottom: 5rem; position: relative; }
        
        .input-wrapper { display: flex; align-items: center; border-bottom: 1px solid var(--tech-line); transition: all 0.3s ease; }
        .input-wrapper:focus-within { border-color: var(--blue-steel); box-shadow: 0 5px 15px rgba(74, 124, 255, 0.1); }
        .search-icon { width: 16px; height: 16px; color: var(--blue-steel); margin-right: 15px; }
        .search-input { width: 100%; padding: 1.2rem 0; background: transparent; border: none; color: var(--white-pure); outline: none; }
        .search-input::placeholder { color: rgba(255, 255, 255, 0.3); }

        .select-wrapper { position: relative; width: 100%; margin-top: 1.5rem; display: flex; align-items: center; border-bottom: 1px solid var(--tech-line); transition: all 0.3s ease; }
        .select-wrapper:focus-within { border-color: var(--blue-steel); }
        .filter-icon { width: 16px; height: 16px; color: var(--blue-steel); margin-right: 15px; }
        .casa-select { width: 100%; padding: 1.2rem 0; background: transparent; border: none; color: var(--white-pure); outline: none; cursor: pointer; appearance: none; }
        .casa-select option { background: var(--bg-black); color: var(--white-pure); }
        .select-wrapper::after { content: "▼"; position: absolute; right: 10px; font-size: 0.6rem; color: var(--blue-steel); pointer-events: none; }

        /* GRID DEL CATÁLOGO - TECHNO FUTURIST */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4rem 2rem; }

        .card {
            display: flex; flex-direction: column; position: relative;
            background: transparent; border-bottom: 1px solid var(--tech-line); 
            padding: 1.5rem 1rem 2.5rem 1rem; transition: all 0.4s ease;
        }
        
        .card:hover {
            border-color: var(--blue-steel);
            background: linear-gradient(180deg, transparent 0%, rgba(74, 124, 255, 0.05) 100%);
            transform: translateY(-5px);
        }

        /* HOLOGRAMA SCI-FI DE FONDO */
        .original-bottle-bg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; max-height: 100px; object-fit: contain;
            opacity: 0.1; filter: grayscale(100%) contrast(120%);
            z-index: 1; transition: all 0.4s ease; pointer-events: none;
        }
        .card:hover .original-bottle-bg { opacity: 0.3; filter: grayscale(50%) sepia(50%) hue-rotate(180deg); transform: translate(-50%, -50%) scale(1.05); }

        /* BOTELLA 3D (Tonos fríos ajustados) */
        .scene { width: 100%; height: 220px; perspective: 1200px; display: flex; justify-content: center; align-items: center; margin-bottom: 2rem; position: relative; }
        .bottle-3d { width: 100px; height: 120px; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 5; }
        .card:hover .bottle-3d { transform: rotateY(-25deg) rotateX(10deg) translateY(-5px); }

        .cap { position: absolute; width: 40px; height: 45px; top: -49px; left: 30px; transform-style: preserve-3d; }
        .cap .face { position: absolute; background: #080808; border: 1px solid #222; outline: 1px solid transparent; }
        .cap .front, .cap .back { width: 40px; height: 45px; }
        .cap .left, .cap .right { width: 40px; height: 45px; left: 0; }
        .cap .top, .cap .bottom { width: 40px; height: 40px; top: 2.5px; }
        .cap .front  { transform: translateZ(20px); }
        .cap .back   { transform: rotateY(180deg) translateZ(20px); }
        .cap .left   { transform: rotateY(-90deg) translateZ(20px); background: #000; }
        .cap .right  { transform: rotateY(90deg) translateZ(20px); background: #111; }
        .cap .top    { transform: rotateX(90deg) translateZ(22.5px); }

        .liquid { position: absolute; bottom: 4px; left: 4px; width: 92px; height: 60px; transform-style: preserve-3d; z-index: 2; transform-origin: bottom center; transition: all 0.8s ease; }
        .card:hover .liquid { animation: slosh 2.5s ease-in-out infinite alternate; filter: drop-shadow(0 0 15px rgba(74,124,255,0.4)); }

        @keyframes slosh { 0% { transform: rotateX(2deg) rotateY(2deg) rotateZ(2deg); } 50% { transform: rotateX(-1deg) rotateY(-1deg) rotateZ(-2deg); } 100% { transform: rotateX(1deg) rotateY(2deg) rotateZ(1deg); } }

        .liquid .face { position: absolute; background: rgba(74, 124, 255, 0.2); outline: 1px solid transparent; transition: background 0.4s ease; }
        .card:hover .liquid .face { background: rgba(74, 124, 255, 0.4); }
        .liquid .front, .liquid .back { width: 92px; height: 60px; }
        .liquid .left, .liquid .right { width: 36px; height: 60px; left: 28px; }
        .liquid .top, .liquid .bottom { width: 92px; height: 36px; top: 12px; }
        .liquid .front  { transform: translateZ(18px); }
        .liquid .back   { transform: rotateY(180deg) translateZ(18px); }
        .liquid .left   { transform: rotateY(-90deg) translateZ(46px); }
        .liquid .right  { transform: rotateY(90deg) translateZ(46px); }
        .liquid .top    { transform: rotateX(90deg) translateZ(30px); background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }

        .tube { position: absolute; width: 3px; height: 110px; background: rgba(255, 255, 255, 0.1); top: 0; left: 48.5px; transform: translateZ(0px); z-index: 3; }

        .glass { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; z-index: 4; }
        .glass .face { position: absolute; background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid rgba(255, 255, 255, 0.2); outline: 1px solid transparent; box-shadow: inset 0 0 15px rgba(255,255,255,0.05); }
        .glass .front, .glass .back { width: 100px; height: 120px; }
        .glass .left, .glass .right { width: 40px; height: 120px; left: 30px; }
        .glass .top, .glass .bottom { width: 100px; height: 40px; top: 40px; }
        .glass .front  { transform: translateZ(20px); }
        .glass .back   { transform: rotateY(180deg) translateZ(20px); }
        .glass .left   { transform: rotateY(-90deg) translateZ(50px); background: rgba(255,255,255,0.02); }
        .glass .right  { transform: rotateY(90deg) translateZ(50px); background: rgba(255,255,255,0.05); }
        .glass .top    { transform: rotateX(90deg) translateZ(60px); border-bottom: none; }
        .glass .bottom { transform: rotateX(-90deg) translateZ(60px); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.9); }

        /* Etiqueta Negra R* */
        .bottle-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -40%) translateZ(21px);
            width: 50px; height: 50px; background: #000000; border: 1px solid var(--blue-steel);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; box-shadow: 0 4px 15px rgba(0,0,0,0.8); transition: all 0.3s ease;
        }
        .card:hover .bottle-label { box-shadow: 0 0 15px rgba(74, 124, 255, 0.4); }
        .bottle-label .logo-r-star-label { width: 30px; height: 30px; border: 1px solid var(--white-pure); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.8rem; color: white; position: relative; }
        .bottle-label .logo-r-star-label span { position: relative; top: 1px; }
        .bottle-label .logo-r-star-label sup { font-size: 0.5rem; position: absolute; top: 2px; right: 2px; }

        /* METADATOS DEL CATÁLOGO */
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem; width: 100%; border-bottom: 1px solid var(--tech-line); padding-bottom: 0.5rem;}
        .card h2 { font-size: 0.9rem; font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: 0.05em; display: flex; align-items: center; justify-content: space-between; width: 100%;}
        
        .ml-badge-title { font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--blue-steel); letter-spacing: 0.1em; font-weight: 700; margin-left: 10px; flex-shrink: 0;}
        .inspiration { font-size: 0.5rem; color: var(--blue-steel); margin-bottom: 1.5rem; }

        .notes { font-size: 0.45rem; color: rgba(255,255,255,0.5); flex-grow: 1; display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 2rem; }
        .notes span { color: var(--white-pure); font-weight: 700; display: block; margin-bottom: 0.1rem; }

        .price-container { display: flex; align-items: center; gap: 8px; }
        .price { font-size: 0.8rem; font-weight: 700; color: var(--white-pure); }

        .minimal-btn { background: transparent; border: 1px solid var(--tech-line); color: var(--white-pure); padding: 0.5rem 0.8rem; text-decoration: none; font-size: 0.5rem; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .card:hover .minimal-btn { background: var(--blue-steel); border-color: var(--blue-steel); color: #000; font-weight: 700; }

        .no-results { grid-column: 1 / -1; text-align: center; padding: 3rem; color: rgba(255,255,255,0.4); font-size: 0.7rem; letter-spacing: 0.2em; }
        
        /* =========================================
           BOTÓN Y VENTANA DEL CHATBOT ORUM AI
           ========================================= */
        .chatbot-launcher {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--blue-steel); color: #000;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000; box-shadow: 0 5px 20px rgba(74, 124, 255, 0.4);
            transition: transform 0.3s ease;
        }
        .chatbot-launcher:hover { transform: scale(1.1); }
        .chatbot-launcher svg { width: 24px; height: 24px; }

        .chatbot-window {
            position: fixed; bottom: 100px; right: 30px;
            width: 350px; max-height: 500px; height: 70vh;
            background: rgba(5, 10, 18, 0.95); backdrop-filter: blur(20px);
            border: 1px solid var(--tech-line-strong);
            display: flex; flex-direction: column; z-index: 1000;
            opacity: 0; pointer-events: none; transform: translateY(20px);
            transition: all 0.3s ease;
        }
        .chatbot-window.active { opacity: 1; pointer-events: auto; transform: translateY(0); }

        .chat-header {
            padding: 15px; border-bottom: 1px solid var(--tech-line);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(74, 124, 255, 0.1);
        }
        .chat-header .title { font-weight: 700; color: var(--blue-steel); font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; }
        .close-chat { background: none; border: none; color: var(--white-pure); cursor: pointer; font-size: 1rem; }

        .chat-body {
            flex-grow: 1; padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
            scrollbar-width: thin; scrollbar-color: var(--blue-steel) transparent;
        }

        .chat-msg {
            max-width: 85%; padding: 10px 12px; font-size: 0.65rem; line-height: 1.4; font-family: 'Space Mono', monospace;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from{ opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .chat-msg.bot { background: rgba(255,255,255,0.05); align-self: flex-start; border-left: 2px solid var(--blue-steel); }
        .chat-msg.user { background: rgba(74, 124, 255, 0.15); align-self: flex-end; border-right: 2px solid var(--white-pure); text-align: right; }

        .chat-options {
            padding: 15px; border-top: 1px solid var(--tech-line);
            display: flex; flex-direction: column; gap: 8px;
        }
        .chat-option-btn {
            background: transparent; border: 1px solid var(--tech-line-strong);
            color: var(--white-pure); padding: 8px; font-family: 'Space Mono', monospace; font-size: 0.6rem;
            cursor: pointer; text-align: center; transition: all 0.2s ease;
        }
        .chat-option-btn:hover { background: var(--blue-steel); color: #000; border-color: var(--blue-steel); font-weight: 700; }

        /* Tarjetas de recomendación en el chat */
        .chat-recommendation {
            display: flex; gap: 10px; background: rgba(255,255,255,0.02);
            border: 1px solid var(--tech-line); padding: 10px; margin-top: 5px; align-items: center;
        }
        .chat-rec-img { width: 30px; height: auto; filter: grayscale(100%); }
        .chat-rec-info h4 { font-family: 'Inter', sans-serif; font-size: 0.65rem; color: var(--white-pure); margin-bottom: 2px;}
        .chat-rec-info p { font-size: 0.5rem; color: var(--blue-steel); margin-bottom: 5px;}
        .chat-wa-link { display: inline-block; color: #000; background: var(--blue-steel); padding: 6px 10px; text-decoration: none; font-size: 0.5rem; font-weight: 700; text-align: center;}

        /* =========================================
           RESPONSIVE MOBILE 
           ========================================= */
        @media (max-width: 1000px) {
            .blueprint-frame { display: none; }
            .content-layer { flex-direction: column; }
            .left-pane { width: 100%; position: relative; height: auto; padding: 4rem 2rem 2rem 2rem; pointer-events: auto; }
            .right-pane { width: 100%; margin-left: 0; padding: 2rem; border-left: none; }
            .frame-line-v { display: none; }
            .giant-text { font-size: 13vw; }
            .tech-paragraph { max-width: 100%; }
            .chatbot-window { width: 90vw; right: 5vw; bottom: 90px; }
            .volumetric-spotlight { width: 100vw; }
        }
    </style>
</head>
<body>

    <!-- STAGE LIGHTING CON EFECTO ROTO Y PARTÍCULAS -->
    <div class="cinematic-stage">
        <div class="volumetric-spotlight"></div>
        <div class="hard-beam"></div>
        <div class="haze"></div>
        <div class="particles-layer-1"></div>
        <div class="particles-layer-2"></div>
    </div>

    <!-- TECHNICAL BLUEPRINT FRAME -->
    <div class="blueprint-frame">
        <div class="cross c-tl"></div>
        <div class="cross c-tr"></div>
        <div class="cross c-bl"></div>
        <div class="cross c-br"></div>
        <div class="frame-line-h"></div>
        <div class="frame-line-v"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content-layer">
        
        <!-- LEFT PANE -->
        <div class="left-pane tech-font">
            <div class="top-nav">
                <div>PRESENCIA QUE SE SIENTE<br>PERFUMES DE INSPIRACIÓN</div>
                <div style="text-align: right;">SS26<br>COLECCIÓN</div>
            </div>

            <div>
                <h1 class="giant-text">
                    <span>ORUM</span>
                    <span>PERFUMERÍA</span>
                </h1>
                
                <div class="tech-subtitle">BASE DE DATOS INICIADA [ READY ]</div>
                
                <p class="tech-paragraph">
                    FÓRMULAS QUE ALTERAN TODO. DISEÑADO EN COLOMBIA. CREADO SOLO PARA LOS AUDACES.
                </p>
            </div>
        </div>

        <!-- RIGHT PANE (CATALOG) -->
        <div class="right-pane">
            <div class="search-container tech-font">
                <div class="input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="searchInput" class="search-input tech-font" placeholder="BUSCAR POR REFERENCIA O CASA...">
                </div>
                
                <div class="select-wrapper">
                    <svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    <select id="casaSelect" class="casa-select tech-font">
                        <option value="">CASAS DISPONIBLES (TODAS)</option>
                    </select>
                </div>
            </div>

            <div class="grid" id="catalog-grid"></div>
        </div>

    </div>

    <!-- LOGO -->
    <div class="logo-r-star">
        <span>R</span><sup>*</sup>
    </div>

    <!-- CHATBOT LAUNCHER & WINDOW -->
    <div class="chatbot-launcher" id="chatbotBtn">

            { name: "MARINE*", insp: "Polo Blue", casa: "Ralph Lauren", salida: "pepino, melón", corazon: "albahaca, salvia", fondo: "gamuza, notas amaderadas", imgOriginal: sampleImg }
        ];

        // ==========================================
        // RENDER DEL CATÁLOGO
        // ==========================================
        const grid = document.getElementById('catalog-grid');
        const searchInput = document.getElementById('searchInput');
        const casaSelect = document.getElementById('casaSelect');

        const casasUnicas = [...new Set(perfumes.map(p => p.casa))].sort();
        casasUnicas.forEach(casa => {
            const option = document.createElement('option');
            option.value = casa.toLowerCase();
            option.textContent = casa;
            casaSelect.appendChild(option);
        });

        function renderGrid(data) {
            grid.innerHTML = '';
            if(data.length === 0) { grid.innerHTML = '<div class="no-results">[ NO SE ENCONTRARON COINCIDENCIAS ]</div>'; return; }

            data.forEach(p => {
                const waLink = `https://wa.me/${phoneNumber}?text=Hola,%20estoy%20interesado%20en%20el%20perfume%20${encodeURIComponent(p.name)}%20inspirado%20en%20${encodeURIComponent(p.insp)}`;
                const cardHTML = `
                    <div class="card">
                        <div class="scene">
                            <img src="${p.imgOriginal}" alt="${p.insp}" class="original-bottle-bg">
                            <div class="bottle-3d">
                                <div class="cap">
                                    <div class="face front"></div><div class="face back"></div>
                                    <div class="face left"></div><div class="face right"></div>
                                    <div class="face top"></div><div class="face bottom"></div>
                                </div>
                                <div class="tube"></div>
                                <div class="liquid">
                                    <div class="face front"></div><div class="face back"></div>
                                    <div class="face left"></div><div class="face right"></div>
                                    <div class="face top"></div>
                                </div>
                                <div class="glass">
                                    <div class="face front"></div><div class="face back"></div>
                                    <div class="face left"></div><div class="face right"></div>
                                    <div class="face top"></div><div class="face bottom"></div>
                                </div>
                                <div class="bottle-label">
                                    <div class="logo-r-star-label"><span>R</span><sup>*</sup></div>
                                </div>
                            </div>
                        </div>

                        <div class="card-header">
                            <h2>${p.name}<span class="ml-badge-title">[ 50ML ]</span></h2>
                        </div>
                        
                        <div class="inspiration tech-font">REF / ${p.insp} — ${p.casa}</div>
                        
                        <div class="notes tech-font">
                            <div><span>[ SALIDA ]</span> ${p.salida}</div>
                            <div><span>[ CORAZÓN ]</span> ${p.corazon}</div>
                            <div><span>[ FONDO ]</span> ${p.fondo}</div>
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--tech-line); padding-top: 1.5rem; margin-top: auto;">
                            <a href="${waLink}" target="_blank" class="minimal-btn">
                                <svg style="width:12px;height:12px;margin-right:6px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                                ORDENAR
                            </a>
                            <div class="price-container">
                                <div class="price tech-font">32.000</div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        function filterPerfumes() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedCasa = casaSelect.value;
            const filteredPerfumes = perfumes.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchTerm) || p.insp.toLowerCase().includes(searchTerm) || p.casa.toLowerCase().includes(searchTerm);
                const matchesCasa = selectedCasa === "" || p.casa.toLowerCase() === selectedCasa;
                return matchesSearch && matchesCasa;
            });
            renderGrid(filteredPerfumes);
        }

        searchInput.addEventListener('input', filterPerfumes);
        casaSelect.addEventListener('change', filterPerfumes);
        renderGrid(perfumes);

        // ==========================================
        // LÓGICA DEL CHATBOT ORUM AI (FLUJO ASEGURADO)
        // ==========================================
        const chatbotBtn = document.getElementById('chatbotBtn');
        const chatbotWindow = document.getElementById('chatbotWindow');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const chatBody = document.getElementById('chatBody');
        const chatOptions = document.getElementById('chatOptions');

        let currentQuestion = 0;
        let userAnswers = {};
        let isChatInitialized = false; // Variable clave para evitar el error del cuadro gris/vacío

        const chatQuestions = [
            { id: "notas", text: "SYS.ON // ORUM AI. Te guiaré hacia tu fragancia ideal. ¿Qué perfil aromático prefieres?", options: ["Dulce / Vainilla", "Amaderado / Cuero", "Cítrico / Fresco", "Acuático / Marino"] },
            { id: "situacion", text: "Entendido. ¿Para qué contexto principal requieres la fragancia?", options: ["Uso Diario / Casual", "Trabajo / Oficina", "Citas / Noche Especial", "Fiestas / Eventos"] },
            { id: "horario", text: "Procesando... ¿En qué momento del día planeas usarla?", options: ["Día", "Noche", "Versátil (Ambos)"] },
            { id: "clima", text: "Parámetro final: ¿Cuál es la temperatura promedio de tu entorno?", options: ["Clima Cálido", "Clima Frío", "Clima Templado"] }
        ];

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('chat-msg', sender);
            msgDiv.textContent = text;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight; // Hacer scroll hacia abajo al recibir un mensaje
        }

        function showOptions(options) {
            chatOptions.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.classList.add('chat-option-btn');
                btn.textContent = opt;
                btn.onclick = () => handleOptionClick(opt);
                chatOptions.appendChild(btn);
            });
            chatBody.scrollTop = chatBody.scrollHeight; // Asegurar que opciones siempre se vean
        }

        function handleOptionClick(optionText) {
            addMessage(optionText, 'user');
            userAnswers[chatQuestions[currentQuestion].id] = optionText;
            chatOptions.innerHTML = ''; 
            currentQuestion++;
            
            setTimeout(() => {
                if (currentQuestion < chatQuestions.length) {
                    addMessage(chatQuestions[currentQuestion].text, 'bot');
                    showOptions(chatQuestions[currentQuestion].options);
                } else {
                    recommendPerfumes();
                }
            }, 500);
        }

        // ALGORITMO DE RECOMENDACIÓN MEJORADO
        function recommendPerfumes() {
            addMessage("ESCANEANDO BASE DE DATOS...", 'bot');
            
            setTimeout(() => {
                addMessage("Análisis completado. Según tus parámetros, he extraído estas 2 referencias exclusivas para ti:", 'bot');
                
                let keywords = [];
                const n = userAnswers.notas;
                
                // Mapeo detallado de notas para asegurar que encuentra perfumes en la DB
                if (n.includes("Dulce")) {
                    keywords = ["vainilla", "haba tonka", "praliné", "azúcar", "caramelo", "cacao", "chocolate", "canela"];
                } else if (n.includes("Amaderado")) {
                    keywords = ["cedro", "cuero", "sándalo", "vetiver", "musgo", "abedul", "madera", "incienso"];
                } else if (n.includes("Cítrico")) {
                    keywords = ["limón", "bergamota", "toronja", "mandarina", "naranja", "lima", "cítricos"];
                } else if (n.includes("Acuático")) {
                    keywords = ["marinas", "calone", "aquozone", "agua", "sal", "acuáticas", "marino"];
                }

                // Evaluar puntuación según los ingredientes en salida, corazon y fondo
                perfumes.forEach(p => {
                    p.score = 0;
                    const allNotes = (p.salida + " " + p.corazon + " " + p.fondo).toLowerCase();
                    keywords.forEach(kw => {
                        if(allNotes.includes(kw)) p.score += 15;
                    });
                    
                    // Añadimos un peso aleatorio mínimo para desempatar aquellos con la misma puntuación
                    p.score += Math.random(); 
                });

                // Ordenar y extraer top 2
                const sortedPerfumes = [...perfumes].sort((a, b) => b.score - a.score);
                const reco1 = sortedPerfumes[0];
                const reco2 = sortedPerfumes[1];

                renderRecommendation(reco1);
                renderRecommendation(reco2);

                // Botones Finales
                chatOptions.innerHTML = '';
                const btnWa = document.createElement('button');
                btnWa.classList.add('chat-option-btn');
                btnWa.textContent = "NO ME CONVENCEN (ASESORÍA PERSONAL)";
                btnWa.onclick = () => {
                    const msg = `Hola, vengo de ORUM AI. Busco un perfume con notas ${userAnswers.notas}, para ${userAnswers.situacion} de ${userAnswers.horario} en ${userAnswers.clima}, pero requiero asesoría humana.`;
                    window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(msg)}`, '_blank');
                };
                chatOptions.appendChild(btnWa);

                const btnRestart = document.createElement('button');
                btnRestart.classList.add('chat-option-btn');
                btnRestart.textContent = "REINICIAR ESCÁNER";
                btnRestart.onclick = () => {
                    chatBody.innerHTML = '';
                    initChat();
                };
                chatOptions.appendChild(btnRestart);

            }, 1200);
        }

        function renderRecommendation(p) {
            const waLink = `https://wa.me/${phoneNumber}?text=Hola,%20ORUM%20AI%20me%20recomendó%20el%20perfume%20${encodeURIComponent(p.name)}%20inspirado%20en%20${encodeURIComponent(p.insp)}`;
            const recHTML = `
                <div class="chat-recommendation">
                    <img src="${p.imgOriginal}" class="chat-rec-img" alt="${p.name}">
                    <div class="chat-rec-info">
                        <h4>${p.name}</h4>
                        <p>REF: ${p.insp}</p>
                        <a href="${waLink}" target="_blank" class="chat-wa-link">ORDENAR</a>
                    </div>
                </div>
            `;
            chatBody.insertAdjacentHTML('beforeend', recHTML);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // Iniciar flujo del chat desde cero
        function initChat() {
            currentQuestion = 0;
            userAnswers = {};
            chatBody.innerHTML = '';
            chatOptions.innerHTML = '';
            addMessage(chatQuestions[0].text, 'bot');
            showOptions(chatQuestions[0].options);
        }

        // Botón abrir chat (Solo se inicializa 1 vez)
        chatbotBtn.addEventListener('click', () => {
            chatbotWindow.classList.add('active');
            if (!isChatInitialized) {
                initChat(); 
                isChatInitialized = true;
            }
        });

        // Botón cerrar chat
        closeChatBtn.addEventListener('click', () => {
            chatbotWindow.classList.remove('active');
        });

    </script>
